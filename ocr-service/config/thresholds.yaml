ocr:
  confidence_threshold: 0.85
  languages: ["en"]
  gpu: false
  batch_size: 8

preprocessing:
  enabled_stages:
    deskew: true
    orientation_correction: true
    denoise: true
    clahe: true
    adaptive_binarization: true
    border_cleanup: true
    upscaling: true
  upscale_min_dpi: 150
  upscale_target_dpi: 300
  save_debug_thumbnails: false

pdf:
  render_dpi: 300
  text_layer_min_chars: 10

output:
  formats: ["json", "txt", "searchable_pdf"]

validation:
  fuzzy_match_threshold: 80
  regex_rules:
    date:
      pattern: '\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b'
      description: "Date in MM/DD/YYYY or similar formats"
    phone:
      pattern: '\b(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
      description: "US phone number"
    currency:
      pattern: '\$\s?\d{1,3}(,\d{3})*(\.\d{2})?'
      description: "USD currency amount"
    email:
      pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
      description: "Email address"
