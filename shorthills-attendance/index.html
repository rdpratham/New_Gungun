<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garvix Ops — Daily Task Buddy</title>
    <meta name="description" content="Garvix Ops Employee Daily Task Buddy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{background:#070d1a;font-family:system-ui,sans-serif}
      #splash{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:#070d1a;
        z-index:9999;transition:opacity .4s ease;
      }
      #splash.hidden{opacity:0;pointer-events:none}
      .splash-logo{
        width:64px;height:64px;border-radius:16px;
        background:linear-gradient(135deg,#7c3aed,#3b82f6);
        display:flex;align-items:center;justify-content:center;
        font-size:28px;color:#fff;font-weight:900;margin-bottom:20px;
      }
      .splash-title{
        font-size:22px;font-weight:700;margin-bottom:4px;
        background:linear-gradient(135deg,#a78bfa,#60a5fa);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      }
      .splash-sub{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:28px}
      .splash-spin{
        width:24px;height:24px;border:2px solid #7c3aed;
        border-top-color:transparent;border-radius:50%;
        animation:spin .7s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
      #crash{
        position:fixed;inset:0;display:none;flex-direction:column;
        align-items:center;justify-content:center;background:#070d1a;
        padding:24px;text-align:center;
      }
      #crash .err-logo{
        width:64px;height:64px;border-radius:16px;
        background:linear-gradient(135deg,#7c3aed,#3b82f6);
        display:flex;align-items:center;justify-content:center;
        font-size:28px;color:#fff;font-weight:900;margin:0 auto 20px;
      }
      #crash h2{color:#fff;font-size:20px;margin-bottom:8px}
      #crash p{color:rgba(255,255,255,.45);font-size:13px;max-width:380px;margin-bottom:24px}
      #crash button{
        padding:10px 28px;border-radius:10px;
        background:linear-gradient(135deg,#7c3aed,#3b82f6);
        color:#fff;border:none;cursor:pointer;font-weight:600;font-size:14px;
      }
    </style>
  </head>
  <body>
    <!-- Splash shown until React mounts -->
    <div id="splash">
      <div class="splash-logo">G</div>
      <div class="splash-title">Garvix Ops</div>
      <div class="splash-sub">Daily Task Buddy</div>
      <div class="splash-spin"></div>
    </div>

    <!-- Shown only if JS crashes before React mounts -->
    <div id="crash">
      <div class="err-logo">G</div>
      <h2>Something went wrong</h2>
      <p>The app failed to load. Please check your internet connection and try again.</p>
      <button onclick="location.reload()">Reload App</button>
    </div>

    <div id="root"></div>

    <script>
      // If JS bundle errors out, show crash screen instead of blank
      window.addEventListener('error', function(e) {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('crash').style.display = 'flex';
      });
      window.addEventListener('unhandledrejection', function(e) {
        // Only show crash for fatal module-load failures
        if (e.reason && e.reason.message && /fetch|network|load/i.test(e.reason.message)) {
          document.getElementById('splash').style.display = 'none';
          document.getElementById('crash').style.display = 'flex';
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
